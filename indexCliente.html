<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <header>
      <nav>
        <a href="login.html">Iniciar sesión como administradora</a>
        <a href="#hero">Reservar turno</a>
        <a href="#servicios">Nuestros servicios</a>
        <a href="#galeria">Galería</a>
        <a href="#contacto">Contacto</a>
      </nav>
    </header>
    <main>
      <section id="hero">
        <div class="hero-container">
          <h1>Agendá tu reserva</h1>
          <form id="reserva-form" action="#" method="post">
            <div class="form-group">
              <label for="nombre-duenio">Nombre del dueño *</label>
              <input
                type="text"
                id="nombre-duenio"
                name="nombre_duenio"
                required
              />
            </div>
            <div class="form-group">
              <label for="telefono">Teléfono celular *</label>
              <input
                type="tel"
                id="telefono"
                name="telefono"
                pattern="[0-9]{10}"
                title="Ingrese 10 dígitos (ej: 099123456)"
                required
              />
            </div>
            <div class="form-group">
              <label for="email">Correo electrónico *</label>
              <input type="email" id="email" name="email" required />
            </div>
            <div class="form-group">
              <label for="nombre-mascota">Nombre de la mascota *</label>
              <input
                type="text"
                id="nombre-mascota"
                name="nombre_mascota"
                required
              />
            </div>
            <div class="form-group">
              <label for="servicio">Servicio o tipo de profesional *</label>
              <select id="servicio" name="servicio" required>
                <option value="">Seleccione un servicio</option>
                <option value="consulta">Consulta veterinaria</option>
                <option value="corte">Corte de pelo</option>
                <option value="banio">Baño</option>
              </select>
            </div>
            <div class="form-group">
              <label for="profesional">Elección del profesional *</label>
              <select id="profesional" name="profesional" required>
                <option value="">Seleccione un profesional</option>
                <option value="vet1">
                  Dr. Juan Pérez (Veterinario general)
                </option>
                <option value="vet2">
                  Dra. María López (Especialista en peluquería)
                </option>
                <option value="vet3">Dr. Carlos Ruiz (Groomer y baños)</option>
              </select>
            </div>
            <div class="form-group">
              <label for="fecha-hora"
                >Fecha y hora (9-18 hs, lunes a viernes) *</label
              >
              <input
                type="datetime-local"
                id="fecha-hora"
                name="fecha_hora"
                required
                min="2026-02-12T09:00"
                max="2026-12-31T18:00"
                step="3600"
              />
            </div>
            <button type="submit">Reservar turno</button>
          </form>
        </div>
      </section>

      <section id="servicios"></section>

      <section id="galeria"></section>

      <section id="contacto"></section>
    </main>

    <footer></footer>

    <script src="clases.js"></script>
    <script src="codigoCliente.js"></script>
  </body>
</html>
